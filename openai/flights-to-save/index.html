<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flights to Save</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=Saira+Extra+Condensed:wght@600&display=swap">
<style>
  /* Light, minimal world: pale grey ground, near-black ink, each flight's airline colour as the accent */
  :root {
    --bg: #f6f7f9;
    --ink: #1c2430;
    --muted: #6b7684;
    --line: #e3e7ec;
    --accent: #ff5a1f;
    --accent-strong: color-mix(in srgb, var(--accent) 84%, #000);
    --gold: #c08a12;
    --good: #109a4c;
    --bad: #d93a3f;
    --glass: rgba(255, 255, 255, 0.84);
    --sky-top: #3f8fd6;
    --sky-bottom: #d4ebf8;
    color-scheme: light;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "B612", "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    overflow-x: hidden;
  }
  .sim-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  :focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 3px; }
</style>
<style type="text/tailwindcss">
  @source inline("animate-pulse-good animate-kick overflow-hidden");
  @theme {
    --color-bg: var(--bg);
    --color-ink: var(--ink);
    --color-muted: var(--muted);
    --color-line: var(--line);
    --color-accent: var(--accent);
    --color-accent-strong: var(--accent-strong);
    --color-gold: var(--gold);
    --color-good: var(--good);
    --color-bad: var(--bad);
    --color-glass: var(--glass);
    --font-display: "Saira Extra Condensed", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
    --font-mono: "B612 Mono", ui-monospace, Menlo, Consolas, monospace;

    --animate-letter: letter 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    --animate-zoom-deep: zoom-deep 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    --animate-zoom-near: zoom-near 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    --animate-fade-up: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    --animate-fade-in: fade-in 1s ease both;
    --animate-warp: warp 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    --animate-slam: slam 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    --animate-badge: badge 1s 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    --animate-pop-up: pop-up 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    --animate-pop-down: pop-down 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    --animate-punch: punch 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    --animate-shake: shake 0.45s;
    --animate-pulse-good: pulse-good 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    --animate-kick: kick 0.5s;
    --animate-impact: impact 1.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    --animate-slide-in: slide-in 0.9s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
    --animate-callout: callout 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    --animate-toast: toast 2.6s ease both;

    @keyframes letter {
      from { transform: scale(6); opacity: 0; filter: blur(22px); }
      to { transform: none; opacity: 1; filter: none; }
    }
    @keyframes zoom-deep {
      from { transform: scale(0.4); opacity: 0; filter: blur(14px); }
      to { transform: none; opacity: 1; filter: none; }
    }
    @keyframes zoom-near {
      from { transform: scale(2.2); opacity: 0; filter: blur(16px); }
      to { transform: none; opacity: 1; filter: none; }
    }
    @keyframes fade-up {
      from { transform: translateY(28px) scale(0.96); opacity: 0; filter: blur(8px); }
      to { transform: none; opacity: 1; filter: none; }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes callout {
      0% { transform: scale(2.6); opacity: 0; filter: blur(18px); }
      18% { transform: none; opacity: 1; filter: none; }
      75% { opacity: 1; }
      100% { transform: scale(0.92); opacity: 0; }
    }
    @keyframes toast {
      0% { opacity: 0; translate: 0 -10px; }
      10%, 85% { opacity: 1; translate: 0 0; }
      100% { opacity: 0; }
    }
    @keyframes slide-in {
      from { transform: translateX(60px) scale(0.94); opacity: 0; filter: blur(12px); }
      to { transform: none; opacity: 1; filter: none; }
    }
    @keyframes warp {
      0% { transform: scale(3.2); opacity: 0; filter: blur(30px) brightness(2); }
      60% { opacity: 1; filter: blur(0) brightness(1.1); }
      100% { transform: none; filter: none; }
    }
    @keyframes slam {
      0% { transform: scale(6); opacity: 0; filter: blur(24px); }
      55% { transform: scale(0.9); opacity: 1; filter: none; }
      75% { transform: scale(1.06); }
      100% { transform: none; }
    }
    @keyframes badge {
      0% { transform: scale(0) rotate(-40deg); opacity: 0; }
      65% { transform: scale(1.25) rotate(6deg); opacity: 1; }
      100% { transform: none; }
    }
    @keyframes pop-up { 0% { transform: scale(1.9); color: var(--good); } 100% { transform: none; } }
    @keyframes pop-down { 0% { transform: scale(0.45); color: var(--bad); } 60% { transform: scale(1.12); } 100% { transform: none; } }
    @keyframes punch { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: none; } }
    @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
    @keyframes pulse-good { 0% { transform: scale(1); } 35% { transform: scale(1.04); } 100% { transform: none; } }
    @keyframes kick {
      0%, 100% { transform: none; }
      20% { transform: translateX(-12px) scale(0.97); }
      40% { transform: translateX(10px) scale(0.97); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(4px); }
    }
    @keyframes impact {
      0% { transform: none; }
      15% { transform: scale(1.22) rotate(-1.5deg); filter: saturate(1.6) contrast(1.2); }
      35% { transform: scale(1.12) rotate(1deg); }
      100% { transform: scale(1.04); filter: saturate(0.8); }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 0.01s !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="worldmap.js"></script>
<script src="globe.js"></script>
<script src="terrain.js"></script>
<script src="sim3d.js"></script>
<script src="incidents.js"></script>
<script src="app.js"></script>
</body>
</html>
